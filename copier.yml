# slide-template：離線 reveal.js 簡報的 Copier 範本。
# 問答的答案會寫進產生專案的 .copier-answers.yml。
# 沒有 _tasks。vendor 是範本裡的靜態檔，index.html 在複製時用 Jinja 寫好。
_min_copier_version: "9.0.0"
_subdirectory: template
_exclude:
  - "**/__pycache__/**"
  - "**/*.py[co]"


project_name:
  type: str
  help: 簡報標題。會出現在投影片、瀏覽器分頁與 README。
  default: slide-template

# 官方 reveal.js 6.0.2 dist/plugin 已打包的內建外掛，加上範本另外附上的 chalkboard。
# 答案是外掛 id 的清單。複製時只把勾選的項目寫進 slide/index.html，沒有執行期選單。
plugins:
  type: str
  multiselect: true
  help: |
    要載入哪些外掛（可複選）。每一項後面都有一句說明。slide/index.html 只會放你勾的那些 script。
    markdown 必須保留，slide.md 靠它載入；沒勾的話這裡會要求你補上。
    預設打開：markdown、highlight、notes、math、chalkboard。
    search、zoom、appearance 在清單裡，預設關閉。
    chalkboard 與 appearance 不是 reveal.js 官方內建，是這個範本另外打包的。
  choices:
    "markdown — 官方內建，把各章 slide.md 載進來當投影片，一定要留著。": markdown
    "highlight — 官方內建，替程式碼區塊加上語法高亮。": highlight
    "notes — 官方內建，放映時按 S 打開講者備註視窗。": notes
    "math — 官方內建，用本機 KaTeX 顯示數學式，不走 CDN。": math
    "search — 官方內建，放映時可以搜尋投影片上的文字。": search
    "zoom — 官方內建，按住 Alt 再點擊就能放大投影片。": zoom
    "chalkboard — 額外打包的外掛，按 C 在投影片上畫、按 B 開黑板。": chalkboard
    "appearance — 社群外掛，讓元素依序進場，像簡報軟體的動畫。": appearance
  default:
    - markdown
    - highlight
    - notes
    - math
    - chalkboard
  validator: "{% if 'markdown' not in plugins %}必須包含 markdown，否則 slide.md 不會被載入。{% endif %}"

_message_after_copy: |
  已產生「{{ project_name }}」。

  外掛（已寫進 slide/index.html，只載入這些）：{{ plugins | join(", ") }}

  下一步（在產生出來的專案根目錄）：
    python -m http.server 8000 --directory slide
  或：
    docker compose up --build

  新增章節：建立 slide/<目錄>/rundown.md（給 agent 的說明）與 slide.md（實際投影片），
  再把一個 section 加進 slide/index.html。沒有 index.md，也沒有產生器腳本。
