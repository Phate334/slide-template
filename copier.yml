# 離線 reveal.js 簡報 Copier 範本。markdown 固定載入，其餘外掛依勾選複製。
_min_copier_version: "9.0.0"
_subdirectory: template
_exclude:
  - "**/__pycache__/**"
  - "**/*.py[co]"
  - "{% if 'highlight' not in plugins %}slide/vendor/reveal.js/dist/plugin/highlight.js{% endif %}"
  - "{% if 'notes' not in plugins %}slide/vendor/reveal.js/dist/plugin/notes.js{% endif %}"
  - "{% if 'math' not in plugins %}slide/vendor/reveal.js/dist/plugin/math.js{% endif %}"
  - "{% if 'search' not in plugins %}slide/vendor/reveal.js/dist/plugin/search.js{% endif %}"
  - "{% if 'zoom' not in plugins %}slide/vendor/reveal.js/dist/plugin/zoom.js{% endif %}"

project_name:
  type: str
  help: 簡報標題。會出現在投影片、瀏覽器分頁與 README。
  default: slide-template

plugins:
  type: str
  multiselect: true
  help: 要載入哪些外掛（可複選）
  choices:
    "highlight — 替程式碼區塊加上語法高亮": highlight
    "notes — 放映時按 S 打開講者備註視窗": notes
    "math — 用本機 KaTeX 顯示數學式": math
    "search — 放映時搜尋投影片文字": search
    "zoom — 按住 Alt 再點擊放大投影片": zoom
    "chalkboard — 按 C 在投影片上畫、按 B 開黑板": chalkboard
    "appearance — 讓元素依序進場": appearance
  default:
    - highlight
    - notes
    - math
    - chalkboard

_message_after_copy: |
  已產生「{{ project_name }}」。
  docker compose up --build
